<title>Property Watch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a working ledger. Sticky tab bar over one column of panels; results in a card grid, tracked properties with a price-band ruler. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --sunk: #e8ece6;
  --ink: #17221d;
  --muted: #5b6a62;
  --line: #d3dbd5;
  --accent: #1f6b55;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe4;
  --good: #227a3d;  --good-soft: #dff0e2;
  --warn: #9a6200;  --warn-soft: #f8ecd2;
  --bad: #b23a2c;   --bad-soft: #f8e1dd;
  --info: #2c5d96;  --info-soft: #e0eaf6;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111814; --surface: #18221d; --sunk: #0d1310; --ink: #e4ece7; --muted: #95a59c; --line: #2b3a32;
    --accent: #5cc4a0; --accent-ink: #08130e; --accent-soft: #1d3a2f;
    --good: #6fd08a; --good-soft: #183323; --warn: #e7b65a; --warn-soft: #3a2e16;
    --bad: #f08a7c; --bad-soft: #3d1f1b; --info: #8db8ea; --info-soft: #1b2b40;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111814; --surface: #18221d; --sunk: #0d1310; --ink: #e4ece7; --muted: #95a59c; --line: #2b3a32;
  --accent: #5cc4a0; --accent-ink: #08130e; --accent-soft: #1d3a2f;
  --good: #6fd08a; --good-soft: #183323; --warn: #e7b65a; --warn-soft: #3a2e16;
  --bad: #f08a7c; --bad-soft: #3d1f1b; --info: #8db8ea; --info-soft: #1b2b40;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.3rem; font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }

header.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-block: 12px 0; }
.brand { display: flex; align-items: baseline; gap: 10px; flex: 1 1 auto; min-width: 0; }
.brand .sub { color: var(--muted); font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; width: 100%; scrollbar-width: none; }
nav.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px; font: 600 0.92rem var(--body); color: var(--muted); cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs .count { font-family: var(--mono); font-size: 0.75rem; background: var(--sunk); border-radius: 99px; padding: 1px 7px; margin-left: 4px; }

main .wrap { padding-block: 20px 60px; display: grid; gap: 20px; }
section.panel { display: grid; gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > span { font-size: 0.82rem; font-weight: 600; color: var(--muted); }
input[type="text"], input[type="number"], input[type="url"], input[type="date"], input[type="password"], input[type="search"], select, textarea {
  width: 100%; font: 400 0.95rem var(--body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0;
}
textarea { min-height: 70px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 0.92rem; cursor: pointer; }
.check input { width: 17px; height: 17px; accent-color: var(--accent); }

.btn { font: 600 0.9rem var(--body); border-radius: 6px; padding: 8px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.big { font-size: 1.05rem; padding: 12px 22px; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: 0.82rem; }
.btn.ghost { border-color: transparent; background: none; }
.btn[disabled] { opacity: 0.6; cursor: progress; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 0.8rem; font-weight: 600; background: var(--sunk); color: var(--ink); white-space: nowrap; }
.chip button { border: 0; background: none; color: inherit; cursor: pointer; font-size: 1rem; line-height: 1; padding: 0; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.info { background: var(--info-soft); color: var(--info); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }

.banner { background: var(--info-soft); color: var(--ink); border-radius: var(--r); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.banner p { flex: 1 1 280px; }
.notice { border-radius: var(--r); padding: 12px 16px; display: grid; gap: 6px; }
.notice.bad { background: var(--bad-soft); }
.notice.warn { background: var(--warn-soft); }
.notice.good { background: var(--good-soft); }

/* suburb type-ahead */
.ac { position: relative; flex: 1 1 260px; min-width: 0; }
.ac ul { position: absolute; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 24px rgb(0 0 0 / 0.12); z-index: 4; max-height: 300px; overflow-y: auto; }
.ac li { padding: 8px 10px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
.ac li[aria-selected="true"], .ac li:hover { background: var(--accent-soft); }
.ac li .pc { font-family: var(--mono); color: var(--muted); font-size: 0.85rem; }

/* tracked property cards */
.props { display: grid; gap: 14px; }
.prop { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: grid; min-width: 0; }
.prop .head { padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: start; }
.addr { font-family: var(--display); font-weight: 700; font-size: 1.1rem; overflow-wrap: anywhere; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.88rem; color: var(--muted); }
.facts b { color: var(--ink); font-weight: 600; }
.score { text-align: right; }
.score .big { font-family: var(--mono); font-size: 1.5rem; font-weight: 600; line-height: 1; }
.prop .body { padding: 0 16px 14px; display: grid; gap: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.prop details { border-top: 1px solid var(--line); }
.prop summary { cursor: pointer; padding: 10px 16px; font-weight: 600; font-size: 0.9rem; color: var(--accent); }
.prop .edit { padding: 4px 16px 16px; display: grid; gap: 14px; }
.tier-priority { border-left: 4px solid var(--accent); }
.tier-downgraded, .tier-outside { opacity: 0.78; }

/* search results */
.results { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 14px; }
.res { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: grid; grid-template-rows: auto 1fr; min-width: 0; }
.res .ph { aspect-ratio: 16 / 10; max-width: 100%; background: var(--sunk); position: relative; }
.res .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.res .ph .badges { position: absolute; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
.res .ph .noimg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 0.85rem; }
.res .inner { padding: 12px 14px 14px; display: grid; gap: 8px; align-content: start; }
.res .price { font-weight: 600; }
.res .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.res.miss { opacity: 0.82; }
.statline { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.stat { display: grid; }
.stat b { font-family: var(--mono); font-size: 1.35rem; font-weight: 600; line-height: 1.1; }

/* band ruler */
.ruler { display: grid; gap: 6px; }
.ruler .verdict { font-size: 0.88rem; }
.ruler .bar { position: relative; height: 10px; margin: 12px 0 4px; background: var(--sunk); border-radius: 3px; }
.ruler .legend { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 0.78rem; color: var(--muted); }
.ruler .legend b { color: var(--ink); font-weight: 600; }
.ruler .seg { position: absolute; top: 0; bottom: 0; }
.ruler .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--muted); }
.ruler .tick.ceil { background: var(--bad); top: -7px; bottom: -7px; }
.ruler .pin { position: absolute; top: -9px; width: 0; height: 0; margin-left: -7px; border: 7px solid transparent; border-top: 11px solid var(--ink); border-bottom: 0; }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; }
.rules { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
ol.rules { padding-left: 22px; }
pre.report { white-space: pre-wrap; word-break: break-word; background: var(--sunk); border-radius: 6px; padding: 14px; font: 0.85rem/1.55 var(--mono); margin: 0; max-height: 520px; overflow: auto; }
details.more > summary { cursor: pointer; font-weight: 600; color: var(--accent); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 6px; font-weight: 600; font-size: 0.9rem; z-index: 20; }
.confirm { background: var(--bad-soft); border-radius: 6px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.empty { text-align: center; padding: 30px 16px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.spinner { width: 18px; height: 18px; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Property Watch</h1>
      <span class="sub" id="briefName"></span>
    </div>
    <div class="row">
      <button class="btn sm" id="exportBtn" type="button">Export backup</button>
      <label class="btn sm" for="importFile">Import</label>

</header>

<main><div class="wrap" id="app"></div></main>

<script>
/* Australian suburbs and postcodes, inlined by scripts/build.sh from data/suburbs.json
   (source: github.com/matthewproctor/australianpostcodes, delivery areas only). */
const SUBURB_DATA = /*__SUBURBS__*/null;
/* Relay that forwards searches to the Domain listings API (see relay/README.md).
   Set this once the relay is deployed so visitors can search with no setup. */
const DEFAULT_SEARCH_URL = "";
</script>
<script>
(() => {
"use strict";

/* ---------- utilities ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => new Date().toISOString().slice(0, 10);
const daysSince = (iso) => { const t = Date.parse(iso); return isFinite(t) ? Math.max(0, Math.floor((Date.now() - t) / 864e5)) : ""; };

/* "$1.12m", "990k", "1,150,000", "Offers over $899,000" -> dollars */
function parseMoney(v) {
  if (v === null || v === undefined || v === "") return null;
  if (typeof v === "number") return isFinite(v) ? v : null;
  const s = String(v).toLowerCase().replace(/[$,\s]/g, "");
  const m = s.match(/(\d+(?:\.\d+)?)(m|k)?/);
  if (!m) return null;
  let n = parseFloat(m[1]);
  if (m[2] === "m") n *= 1e6; else if (m[2] === "k") n *= 1e3;
  else if (n < 10) n *= 1e6;
  else if (n < 10000) n *= 1e3;
  return Math.round(n);
}
function parseRange(v) {
  if (!v) return [null, null];
  const s = String(v).toLowerCase().replace(/[$,\s]/g, "").replace(/to/g, "-");
  const parts = s.split(/[-–]/).filter(p => /\d/.test(p));
  if (parts.length < 2) { const n = parseMoney(s); return [n, n]; }
  const unit = (parts[1].match(/[mk]$/) || [""])[0];
  const lo = parseMoney(/[mk]$/.test(parts[0]) ? parts[0] : parts[0] + unit);
  return [lo, parseMoney(parts[1])];
}
function fmt(n) {
  if (n === null || n === undefined || !isFinite(n)) return "—";
  if (n >= 1e6) return "$" + (n / 1e6).toFixed(3).replace(/0+$/, "").replace(/\.$/, "") + "m";
  return "$" + Math.round(n / 1e3) + "k";
}
function parseSuburb(s) {
  const m = String(s).trim().match(/^(.*?)[,\s]+(QLD|NSW|VIC|SA|WA|TAS|NT|ACT)\s*(\d{4})?$/i);
  if (!m) return { name: String(s).trim(), state: "", pc: "" };
  return { name: m[1].trim(), state: m[2].toUpperCase(), pc: m[3] || "" };
}
const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const g = (q) => "https://www.google.com/search?q=" + encodeURIComponent(q);

/* ---------- suburb index for type-ahead ---------- */
let SUBURBS = null;
function suburbIndex() {
  if (SUBURBS) return SUBURBS;
  SUBURBS = [];
  if (SUBURB_DATA) for (const [st, list] of Object.entries(SUBURB_DATA)) for (const item of list.split("|")) {
    const [n, p] = item.split("~");
    SUBURBS.push({ n, s: st, p, k: n.toLowerCase() });
  }
  return SUBURBS;
}
function suggest(q) {
  q = q.trim().toLowerCase();
  if (q.length < 2) return [];
  const idx = suburbIndex(), starts = [], contains = [];
  const isPc = /^\d{3,4}$/.test(q);
  for (const s of idx) {
    if (isPc) { if (s.p.startsWith(q)) starts.push(s); continue; }
    const full = `${s.k} ${s.s.toLowerCase()} ${s.p}`;
    if (full.startsWith(q)) starts.push(s); else if (contains.length < 20 && s.k.includes(q)) contains.push(s);
  }
  starts.sort((a, b) => (a.k === q ? -1 : 0) - (b.k === q ? -1 : 0) || a.k.length - b.k.length || a.k.localeCompare(b.k));
  return starts.concat(contains).slice(0, 10);
}
const subLabel = (s) => `${s.n} ${s.s} ${s.p}`;

/* ---------- storage (per-browser) ---------- */
const KEY = "property-watch.v2";
function load() { try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { /* storage blocked: session-only */ } }
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2800); }

/* ---------- model ---------- */
const PROPERTY_TYPES = [["House", "House"], ["Townhouse", "Townhouse"], ["ApartmentUnitFlat", "Apartment / unit"], ["Villa", "Villa"], ["Duplex", "Duplex"], ["VacantLand", "Land"]];
const LEAD_TYPES = { mainstream: "Mainstream listing", auction: "Auction", mortgagee: "Mortgagee sale", receiver: "Receiver / liquidator", deceased: "Deceased estate", offmarket: "Off-market / coming soon", stale: "Stale / price reduced", distressed: "Other distressed", other: "Other lead" };
const STATUSES = ["Active", "Under offer", "Under contract", "Sold", "Withdrawn", "Relisted", "Off-market", "Unknown"];
const TIERS = { priority: "Priority", watch: "Watchlist", candidate: "New candidate", downgraded: "Downgraded", outside: "Outside strategy" };
const DD_ITEMS = [
  ["flood", "Flood overlay checked (current and future planning maps)"],
  ["insurance", "Insurance quote for the actual address"],
  ["bp", "Building and pest inspection"],
  ["title", "Title search, zoning and council overlays"],
  ["easement", "Easements, sewer lines and overland flow paths"],
  ["comps", "At least 3 comparable sales from the last 6 months"],
  ["contract", "Contract conditions set (finance, B&P, DD period)"],
  ["rent", "Rental appraisal from a local property manager", (b) => b.purpose === "investment"],
  ["vacancy", "Vacancy rate and days-to-lease checked for the suburb", (b) => b.purpose === "investment"],
  ["depreciation", "Depreciation estimate and landlord insurance quote", (b) => b.purpose === "investment"],
  ["strata", "Body corporate records, levies and sinking fund", (b) => (b.types || []).some(t => t !== "House" && t !== "VacantLand")],
  ["pool", "Pool safety certificate (or pool buildability confirmed)", (b) => b.pool !== "none"],
  ["shed", "Shed approval and power supply", (b) => b.shed],
];
const ddItems = () => DD_ITEMS.filter(([, , when]) => !when || when(state.brief));

const blankBrief = () => ({
  name: "", goal: "", purpose: "home", types: ["House"], ceiling: "", preferredMax: "", targetYield: "",
  beds: 3, baths: 1, landMin: "",
  pool: "none", access: false, shed: false, solar: false, battery: false, rain: false,
  trainKm: "", school: "", schoolKm: "", mustHaves: "", suburbs: [], includeUnderOffer: false,
});
const blankProp = () => ({
  id: uid(), added: today(), address: "", suburb: "", tier: "candidate", status: "Active", lead: "mainstream",
  price: "", rent: "", beds: "", baths: "", cars: "", land: "", type: "", pool: "unknown", access: "unknown", shed: "unknown",
  solar: false, battery: false, rain: false, trainKm: "", schoolKm: "", dom: "",
  bands: { open: "", target: "", comfortable: "", limit: "", walk: "" },
  flood: "", dd: {}, comps: [], sources: [], notes: "", verified: true, history: [], listingId: "", url: "",
});

function exampleState() {
  const b = Object.assign(blankBrief(), {
    name: "Example: first investment property",
    goal: "Buy a low-maintenance rental with solid yield and long-term growth, keeping a cash buffer for rates, vacancy and repairs.",
    purpose: "investment", types: ["House", "Townhouse"], ceiling: "750000", preferredMax: "690000", targetYield: "4.5",
    beds: 3, baths: 2, pool: "none", trainKm: 3, school: "Shopping centre", schoolKm: 3,
    mustHaves: "Low maintenance. Easy to rent: near transport, shops and schools. Avoid flood-affected streets and high body corporate fees.",
    suburbs: ["Redbank Plains QLD 4301", "Goodna QLD 4300", "Caboolture QLD 4510", "Morayfield QLD 4506", "Logan Central QLD 4114"],
  });
  const p1 = Object.assign(blankProp(), {
    address: "Example A (sample data)", suburb: "Goodna", tier: "priority", type: "Townhouse",
    price: "$615-630k", rent: 560, beds: 3, baths: 2, cars: 1, land: 180, trainKm: 1.2, schoolKm: 1, dom: 18,
    bands: { open: "600000", target: "620000", comfortable: "635000", limit: "650000", walk: "660000" },
    flood: "Not on the current flood map. Check overland flow.", dd: { flood: true, rent: true },

function priceOf(p) { const [lo, hi] = parseRange(p.price); return lo ?? hi; }

  const add = (w, ok, label, partial) => { max += w; if (ok) { got += w; if (label) pros.push(label); } else if (partial) { got += w / 2; } };
  const price = priceOf(p), ceiling = parseMoney(b.ceiling), pref = parseMoney(b.preferredMax);
  const limit = parseMoney(p.bands.limit);
  const y = yieldOf(p), ty = parseFloat(b.targetYield);
  if (ceiling && price && price > ceiling) flags.push("Price above ceiling");
  if (ceiling && limit && limit > ceiling) flags.push("Your limit is above the ceiling");
  if (b.beds && p.beds !== "" && +p.beds < +b.beds) flags.push(`Only ${p.beds} bed`);
  if (b.baths && p.baths !== "" && +p.baths < +b.baths) flags.push(`Only ${p.baths} bath`);
  if (b.landMin && p.land !== "" && +p.land < +b.landMin) flags.push(`Land ${p.land} m² under ${b.landMin}`);
  if (b.pool === "required" && p.pool !== "yes") flags.push("No pool");
  if (b.pool === "buildable" && p.pool === "no") flags.push("No pool and not buildable");
  if (b.purpose === "investment" && ty && y !== null && y < ty - 1) flags.push(`Yield ${y.toFixed(1)}%`);
  if (["Sold", "Withdrawn"].includes(p.status)) flags.push(p.status);
  if (!p.verified) flags.push("Unverified lead");

  if (pref) add(3, price && price <= pref, "Under preferred spend", price && ceiling && price <= ceiling);
  if (b.purpose === "investment" && ty) add(3, y !== null && y >= ty, y !== null ? `Yield ${y.toFixed(1)}%` : "", y !== null && y >= ty - 0.5);
  if (b.beds) add(2, p.beds !== "" && +p.beds >= +b.beds, p.beds !== "" ? `${p.beds} bed` : "");
  if (b.landMin) add(2, p.land !== "" && +p.land >= +b.landMin, p.land !== "" ? `${p.land} m²` : "");
  if (b.pool !== "none") add(2, p.pool === "yes", "Pool", p.pool === "buildable" && b.pool !== "required");
  if (b.access) add(2, p.access === "yes", "Side/rear access");
  if (b.shed) add(2, p.shed === "powered", "Powered shed", p.shed === "unpowered");
  if (b.solar) add(1, !!p.solar, "Solar");
  if (b.battery) add(1, !!p.battery, "Battery");
  if (b.rain) add(1, !!p.rain, "Rainwater");
  if (b.trainKm) add(1, p.trainKm !== "" && +p.trainKm <= +b.trainKm, "Near train");
  if (b.school && b.schoolKm) add(1, p.schoolKm !== "" && +p.schoolKm <= +b.schoolKm, "Near " + b.school);

}

function bandVerdict(p, price) {
  const B = Object.fromEntries(Object.entries(p.bands).map(([k, v]) => [k, parseMoney(v)]));
  const ceiling = parseMoney(state.brief.ceiling);
  if (!price) return { tone: "info", text: "No price guide recorded. Use comparable sales to set a value." };
  if (!B.target && !B.limit && !B.walk) return { tone: "info", text: "No bands set yet. Set a target, limit and walk-away before you inspect." };
  const walk = B.walk ?? ceiling;
  if (walk && price >= walk) return { tone: "bad", text: `Guide ${fmt(price)} is at or past walk-away (${fmt(walk)}).` };
  if (ceiling && price > ceiling) return { tone: "bad", text: `Guide ${fmt(price)} is above your ceiling.` };
  if (B.limit && price > B.limit) return { tone: "bad", text: `Guide ${fmt(price)} is above your limit (${fmt(B.limit)}). Only proceed if the vendor moves.` };
  if (B.comfortable && price > B.comfortable) return { tone: "warn", text: `Guide ${fmt(price)} is between comfortable and limit. Proceed only if due diligence is clean.` };
  if (B.target && price > B.target) return { tone: "warn", text: `Guide ${fmt(price)} is above target but within comfortable.` };

function rulerHTML(p, price) {
  const B = p.bands, pts = [["open", "Open"], ["target", "Target"], ["comfortable", "Comf."], ["limit", "Limit"], ["walk", "Walk"]]
    .map(([k, l]) => [l, parseMoney(B[k])]).filter(x => x[1]);
  if (pts.length < 2) return "";
  const ceiling = parseMoney(state.brief.ceiling);
  const vals = pts.map(x => x[1]).concat(price ? [price] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.06 || 20000; lo -= pad; hi += pad;
  const x = (v) => (((v - lo) / (hi - lo)) * 100).toFixed(2);
  const get = (k) => parseMoney(B[k]);
  const seg = (a, b, cls) => (a && b && b > a) ? `<span class="seg" style="left:${x(a)}%;width:${(x(b) - x(a)).toFixed(2)}%;background:var(--${cls})"></span>` : "";
  let h = `<div class="bar" role="img" aria-label="Guide price against negotiation bands">`;
  h += seg(get("open") ?? lo, get("target"), "good-soft");
  h += seg(get("target"), get("comfortable") ?? get("limit"), "warn-soft");
  h += seg(get("comfortable"), get("limit"), "warn-soft");
  h += seg(get("limit"), get("walk") ?? (ceiling && ceiling <= hi ? ceiling : null), "bad-soft");
  pts.forEach(([l, v]) => { h += `<span class="tick" style="left:${x(v)}%" title="${l} ${fmt(v)}"></span>`; });
  if (ceiling && ceiling < hi && !pts.some(([, v]) => v === ceiling)) h += `<span class="tick ceil" style="left:${x(ceiling)}%" title="Ceiling ${fmt(ceiling)}"></span>`;
  if (price) h += `<span class="pin" style="left:${x(price)}%" title="Guide ${fmt(price)}"></span>`;
  h += `</div><div class="legend num">${pts.map(([l, v]) => `<span>${l} <b>${fmt(v)}</b></span>`).join("")}${price ? `<span>▼ Guide <b>${fmt(price)}</b></span>` : ""}</div>`;
  return h;
}

/* ---------- live search (Domain listings API) ---------- */
const DOMAIN_SEARCH = "https://api.domain.com.au/v1/listings/residential/_search";

const canSearch = () => !!(searchUrl() || state.settings.apiKey.trim());

function buildQuery(b, page) {
  const locations = b.suburbs.map(parseSuburb).map(s => ({ state: s.state, suburb: s.name, postCode: s.pc, includeSurroundingSuburbs: false }));
  const q = {
    listingType: "Sale", propertyTypes: b.types.length ? b.types : ["House"], locations,
    minBedrooms: +b.beds || undefined, minBathrooms: +b.baths || undefined,
    maxPrice: parseMoney(b.ceiling) || undefined,

  const res = relay
    ? await fetch(relay + "/search", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
    : await fetch(DOMAIN_SEARCH, { method: "POST", headers: { "Content-Type": "application/json", "X-Api-Key": state.settings.apiKey.trim() }, body: JSON.stringify(body) });
  if (!res.ok) {

  }

const SIGNALS = [

  [/receiver|liquidat|controller appointed/i, "Receiver"], [/price (reduced|drop|adjust)|reduced to sell|new price/i, "Price reduced"],
  [/motivated|must (be )?sold|must sell|urgent sale|relocat/i, "Motivated vendor"],

function mapListing(l) {

  const text = [l.headline, l.summaryDescription, (d.features || []).join(" ")].join(" ");
  const price = pr.price || pr.priceFrom || parseMoney(pr.displayPrice);
  const img = (l.media || []).find(m => m.category === "Image");
  const auction = l.auctionSchedule && l.auctionSchedule.time;
  const signals = SIGNALS.filter(([re]) => re.test(text)).map(([, label]) => label);

    beds: d.bedrooms ?? "", baths: d.bathrooms ?? "", cars: d.carspaces ?? "", land: d.landArea ? Math.round(d.landArea) : "",
    type: d.propertyType || "", img: img ? img.url : "", headline: l.headline || "", dateListed: l.dateListed || "", dom,

async function runSearch() {
  const b = state.brief;
  if (!b.suburbs.length) { toast("Add at least one suburb to your brief first"); return setTab("brief"); }
  if (!canSearch()) { searchError = { kind: "setup" }; return setTab("search"); }
  searching = true; searchError = null; render();
  try {
    let raw = [];
    for (let page = 1; page <= 3; page++) {
      const batch = await callSearch(buildQuery(b, page));
      if (!Array.isArray(batch)) throw Object.assign(new Error("Unexpected response from the search service"), { status: 502 });
      raw = raw.concat(batch);
      if (batch.length < 100) break;
    }
    const listings = [];
    raw.forEach(item => {
      if (item.type === "PropertyListing" && item.listing) listings.push(item.listing);
      else if (item.type === "Project" && Array.isArray(item.listings)) listings.push(...item.listings);
    });
    const seen = new Set(), items = [];
    listings.forEach(l => { if (l && !seen.has(String(l.id))) { seen.add(String(l.id)); items.push(mapListing(l)); } });
    const prev = state.results ? Object.fromEntries(state.results.items.map(r => [r.id, { address: r.address, suburb: r.suburb, priceText: r.priceText, url: r.url }])) : null;
    items.forEach(r => {

    toast(`Found ${items.length} listing${items.length === 1 ? "" : "s"}`);

function syncTracked(items) {

    const r = p.listingId && byId[p.listingId];
    if (!r) return;
    if (r.priceText && r.priceText !== p.price) { p.history.push({ date: today(), field: "Price", from: p.price, to: r.priceText, source: r.url }); p.price = r.priceText; }

      <li>A guide above your walk-away is a pass unless the vendor moves. The tool flags it red.</li>
      ${inv ? "<li>Check the rent with a local property manager before relying on the yield.</li>" : ""}
      <li>Searches use public listing data only. Mortgagee, estate and other distressed signals are read from the listing text; confirm them before you rely on them.</li>
      <li>Check flood on the current and future council maps, and get an insurance quote for the actual address.</li>
      <li>This tool only searches, records and compares. It does not contact agents or make offers.</li>
    </ul>
  </div>
  <div class="row">${searchBtn("Run search")}</div>
</section>`;
}

function renderSearch() {
  const b = state.brief, L = b.suburbs.length ? portalLinks(b) : null, r = state.results;
  const typeNames = b.types.map(t => (PROPERTY_TYPES.find(x => x[0] === t) || [t, t])[1]).join(", ") || "House";
  const summary = `${typeNames}, ${b.beds || 0}+ bed, ${b.baths || 0}+ bath${parseMoney(b.ceiling) ? ", up to " + fmt(parseMoney(b.ceiling)) : ""} in ${b.suburbs.length} suburb${b.suburbs.length === 1 ? "" : "s"}`;
  let notice = "";
  if (searchError) {
    if (searchError.kind === "setup") notice = `<div class="notice warn"><b>Searching isn't connected yet.</b><p class="small">Add a search service address or your own Domain API key under <b>Search connection</b> below.</p></div>`;
    else if (searchError.kind === "network") notice = `<div class="notice bad"><b>Couldn't reach the search service.</b><p class="small">Check your internet connection. If you're using your own API key, your browser may be blocking direct calls to Domain; set up the free relay instead (see the steps below).</p></div>`;
    else {
      const s = searchError.status;
      const why = s === 401 || s === 403 ? "The API key was refused. Check that it's correct and that your Domain developer project includes the Listings Management (or Agents & Listings) API."
        : s === 429 ? "The daily search limit has been reached. Try again tomorrow."
        : s === 400 ? "The search was rejected. Check that each suburb has a state and postcode." : "The search service returned an error.";
      notice = `<div class="notice bad"><b>Search failed (error ${esc(s)}).</b><p class="small">${esc(why)}</p>${searchError.message ? `<p class="small muted num">${esc(searchError.message)}</p>` : ""}</div>`;
    }
  }
  const relayConnected = !!searchUrl();
  return `<section class="panel">
  <div class="card">
    <div><h2>Search</h2><p class="muted small">Searches every suburb in your brief at once and shows all the results on one page, scored against your brief.</p></div>
    ${b.suburbs.length ? `<p><b>${esc(summary)}</b></p>` : `<div class="notice warn"><b>No suburbs in your brief.</b><p class="small">Add the suburbs you want to search first.</p><div><button class="btn sm" type="button" data-tab-go="brief">Open the brief</button></div></div>`}
    <div class="row">
      ${searchBtn("Run search")}
      ${r ? `<button class="btn" type="button" data-tab-go="results">View last results (${r.items.length})</button><span class="small muted">Last searched ${esc(new Date(r.at).toLocaleString("en-AU", { dateStyle: "medium", timeStyle: "short" }))}</span>` : ""}
    </div>
    <label class="check"><input id="s-uo" type="checkbox" data-b="includeUnderOffer"${b.includeUnderOffer ? " checked" : ""}> Include listings under offer (useful for watching sales that fall over)</label>
    ${notice}
  </div>

  <div class="card">
    <div class="row between"><h3>Search connection</h3><span class="chip ${canSearch() ? "good" : "warn"}">${canSearch() ? (relayConnected ? "Connected via search service" : "Using your API key") : "Not connected"}</span></div>
    <p class="small muted">Results come from Domain's official listings API. Use a search service someone has set up for you, or your own free Domain developer key. Both are saved only in this browser.</p>
    <div class="grid2">
      <label class="field"><span>Search service address</span><input id="set-url" type="url" data-set="searchUrl" value="${esc(state.settings.searchUrl)}" placeholder="${esc(DEFAULT_SEARCH_URL || "https://property-search.example.workers.dev")}"></label>
      <label class="field"><span>Or your own Domain API key</span><input id="set-key" type="password" data-set="apiKey" value="${esc(state.settings.apiKey)}" placeholder="key_…" autocomplete="off"></label>
    </div>
    <details class="more"><summary>How to get connected</summary>
      <ol class="rules small" style="margin-top:10px">
        <li>Create a free account at <a href="https://developer.domain.com.au" target="_blank" rel="noopener">developer.domain.com.au</a>, create a project, add the <b>Listings Management</b> (or <b>Agents &amp; Listings</b>) API, and create an API key.</li>
        <li>Paste the key above and press <b>Run search</b>. If it says the browser blocked the call, use step 3.</li>
        <li>To let anyone use your app without their own key, deploy the free relay in the project's <code>relay</code> folder to Cloudflare Workers and put its address in <b>Search service address</b>.</li>
      </ol>
    </details>
  </div>

  ${L ? `<div class="card">
    <h3>Check the portals by hand</h3>
    <p class="small muted">Some listings appear on only one portal. These open the same search on each site.</p>
    <div class="row"><a class="btn sm" href="${esc(L.rea)}" target="_blank" rel="noopener">realestate.com.au</a><a class="btn sm" href="${esc(L.domain)}" target="_blank" rel="noopener">Domain</a></div>
  </div>` : ""}
</section>`;
}

let resSort = "fit", resHide = false, resQuery = "";
function renderResults() {
  const r = state.results;
  if (!r) return `<section class="panel"><div class="card empty"><h2>No results yet</h2><p>Run a search to see every matching listing here on one page.</p>${searchBtn("Run search", "primary")}</div></section>`;
  const tracked = new Set(state.props.map(p => p.listingId).filter(Boolean));
  let items = r.items.map(it => ({ it, A: assess(resultAsProp(it)) }));
  const counts = { total: items.length, fit: items.filter(x => !x.A.flags.length).length, isNew: items.filter(x => x.it.isNew).length, changed: items.filter(x => x.it.wasPrice).length, signals: items.filter(x => x.it.signals.length).length };
  if (resHide) items = items.filter(x => !x.A.flags.length);
  if (resQuery) { const q = resQuery.toLowerCase(); items = items.filter(x => `${x.it.address} ${x.it.suburb} ${x.it.headline}`.toLowerCase().includes(q)); }
  const sorters = {
    fit: (a, b) => (a.A.flags.length - b.A.flags.length) || (b.A.score - a.A.score),
    priceAsc: (a, b) => (a.it.priceNum ?? 9e9) - (b.it.priceNum ?? 9e9),
    priceDesc: (a, b) => (b.it.priceNum ?? -1) - (a.it.priceNum ?? -1),
    newest: (a, b) => (b.it.dateListed || "").localeCompare(a.it.dateListed || ""),
    oldest: (a, b) => (a.it.dateListed || "~").localeCompare(b.it.dateListed || "~"),
    land: (a, b) => (+b.it.land || 0) - (+a.it.land || 0),
  };
  items.sort(sorters[resSort] || sorters.fit);
  const card = ({ it, A }) => {
    const tone = A.flags.length ? "bad" : A.score >= 75 ? "good" : A.score >= 50 ? "warn" : "info";
    const badges = [it.isNew ? `<span class="chip good">New</span>` : "", it.wasPrice ? `<span class="chip warn">Price changed</span>` : ""].join("");
    const facts = [it.beds !== "" && `<span><b>${esc(it.beds)}</b> bed</span>`, it.baths !== "" && `<span><b>${esc(it.baths)}</b> bath</span>`, it.cars !== "" && `<span><b>${esc(it.cars)}</b> car</span>`, it.land !== "" && `<span><b>${esc(it.land)}</b> m²</span>`, it.type && `<span>${esc(it.type)}</span>`].filter(Boolean).join("");
    const where = [it.address, it.suburb, it.state].filter(Boolean).join(", ");
    return `<article class="res${A.flags.length ? " miss" : ""}">
      <div class="ph">${it.img ? `<img src="${esc(it.img)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : `<span class="noimg">No photo</span>`}<div class="badges">${badges}</div></div>
      <div class="inner">
        <div class="row between" style="align-items:start;flex-wrap:nowrap"><div style="min-width:0"><div class="addr">${esc(it.address)}</div><div class="small muted">${esc([it.suburb, it.state, it.pc].filter(Boolean).join(" "))}</div></div>
          <div class="score"><div class="big" style="color:var(--${tone})">${A.score}</div><div class="label">fit</div></div></div>
        <div class="price">${esc(it.priceText)}${it.wasPrice ? ` <span class="small muted">was ${esc(it.wasPrice)}</span>` : ""}</div>
        <div class="facts">${facts}</div>
        <div class="chips">${A.flags.map(f => `<span class="chip bad">${esc(f)}</span>`).join("")}${it.signals.map(s => `<span class="chip info">${esc(s)}</span>`).join("")}${A.pros.filter(p => !/bed$|m²$/.test(p)).map(p => `<span class="chip">${esc(p)}</span>`).join("")}</div>
        ${it.dom !== "" ? `<p class="small muted">Listed ${it.dom === 0 ? "today" : it.dom + " days ago"}</p>` : ""}
        <div class="links">
          <a class="btn sm primary" href="${esc(it.url)}" target="_blank" rel="noopener">View listing</a>
          <a class="btn sm" href="${esc(g(where + " site:realestate.com.au"))}" target="_blank" rel="noopener">Find on realestate.com.au</a>
          ${tracked.has(it.id) ? `<span class="chip accent">Tracking</span>` : `<button class="btn sm" type="button" data-act="track" data-id="${esc(it.id)}">Track</button>`}
        </div>
      </div>
    </article>`;
  };
  const gone = (r.gone || []).map(x => `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.address)}</a>${x.suburb ? ", " + esc(x.suburb) : ""} <span class="muted">(${esc(x.priceText)})</span></li>`).join("");
  return `<section class="panel">
  <div class="card">
    <div class="row between"><div><h2>Search results</h2><p class="small muted">Searched ${esc(new Date(r.at).toLocaleString("en-AU", { dateStyle: "medium", timeStyle: "short" }))} across ${r.suburbs} suburb${r.suburbs === 1 ? "" : "s"}. Features such as pool, shed and solar are read from the listing text, so check the listing itself.</p></div>
      ${searchBtn("Search again", "primary")}</div>
    <div class="statline">
      <div class="stat"><b>${counts.total}</b><span class="small muted">listings</span></div>
      <div class="stat"><b>${counts.fit}</b><span class="small muted">meet every must-have</span></div>
      ${r.first ? "" : `<div class="stat"><b>${counts.isNew}</b><span class="small muted">new since last search</span></div><div class="stat"><b>${counts.changed}</b><span class="small muted">price changes</span></div><div class="stat"><b>${(r.gone || []).length}</b><span class="small muted">no longer listed</span></div>`}
      <div class="stat"><b>${counts.signals}</b><span class="small muted">auction, distressed or stale</span></div>
    </div>
    <div class="row" style="align-items:end">
      <label class="field" style="flex:0 1 220px"><span>Sort by</span><select id="r-sort" data-ui="sort">${opt([["fit", "Best fit"], ["priceAsc", "Price: low to high"], ["priceDesc", "Price: high to low"], ["newest", "Newest listings"], ["oldest", "Longest on market"], ["land", "Largest land"]], resSort)}</select></label>
      <label class="field" style="flex:1 1 220px"><span>Filter</span><input id="r-q" type="search" data-ui="q" value="${esc(resQuery)}" placeholder="Street, suburb or keyword"></label>
      <label class="check" style="padding-bottom:8px"><input id="r-hide" type="checkbox" data-ui="hide"${resHide ? " checked" : ""}> Only show listings that meet every must-have</label>
    </div>
  </div>
  ${items.length ? `<div class="results">${items.map(card).join("")}</div>` : `<div class="card empty"><p>No listings match. ${resHide || resQuery ? "Clear the filter to see everything." : "Try more suburbs, a higher ceiling or fewer bedrooms."}</p></div>`}
  ${gone ? `<div class="card"><h3>No longer in the results</h3><p class="small muted">These were in your last search. They may be under offer, sold or withdrawn, or the price moved outside your range.</p><ul class="rules small">${gone}</ul></div>` : ""}
</section>`;
}

function propCard(p) {
  const A = assess(p), v = bandVerdict(p, A.price), inv = state.brief.purpose === "investment";
  const scoreTone = A.flags.length ? "bad" : A.score >= 75 ? "good" : A.score >= 50 ? "warn" : "info";
  const statusTone = { "Active": "good", "Relisted": "good", "Under offer": "warn", "Under contract": "warn", "Sold": "bad", "Withdrawn": "bad" }[p.status] || "info";
  const facts = [
    p.price && `<span><b>${esc(p.price)}</b></span>`,
    p.beds !== "" && `<span><b>${esc(p.beds)}</b> bed</span>`, p.baths !== "" && `<span><b>${esc(p.baths)}</b> bath</span>`, p.cars !== "" && `<span><b>${esc(p.cars)}</b> car</span>`,
    p.land !== "" && `<span><b>${esc(p.land)}</b> m²</span>`, inv && p.rent !== "" && `<span><b>$${esc(p.rent)}</b>/wk rent</span>`,
    A.yld !== null && `<span><b>${A.yld.toFixed(1)}%</b> gross yield</span>`, p.dom !== "" && `<span><b>${esc(p.dom)}</b> days listed</span>`,
  ].filter(Boolean).join("");
  const items = ddItems();
  const dd = items.map(([k, l]) => `<label class="check small"><input id="dd-${p.id}-${k}" type="checkbox" data-pid="${p.id}" data-dd="${k}"${p.dd[k] ? " checked" : ""}> ${esc(l)}</label>`).join("");
  const ddDone = items.filter(([k]) => p.dd[k]).length;
  const comps = p.comps.map((c, i) => `<tr><td><input id="c-${p.id}-${i}-a" type="text" data-pid="${p.id}" data-comp="${i}" data-cf="addr" value="${esc(c.addr)}" aria-label="Comparable address"></td>
    <td><input id="c-${p.id}-${i}-p" type="text" data-pid="${p.id}" data-comp="${i}" data-cf="price" value="${esc(c.price)}" aria-label="Sold price"></td>
    <td><input id="c-${p.id}-${i}-d" type="date" data-pid="${p.id}" data-comp="${i}" data-cf="date" value="${esc(c.date)}" aria-label="Sold date"></td>
    <td><input id="c-${p.id}-${i}-l" type="number" data-pid="${p.id}" data-comp="${i}" data-cf="land" value="${esc(c.land)}" aria-label="Land m²"></td>
    <td><button class="btn sm ghost danger" type="button" data-act="rmcomp" data-pid="${p.id}" data-i="${i}" aria-label="Remove comparable">×</button></td></tr>`).join("");
  const compPrices = p.comps.map(c => parseMoney(c.price)).filter(Boolean).sort((a, b) => a - b);
  const median = compPrices.length ? compPrices[Math.floor((compPrices.length - 1) / 2)] / 2 + compPrices[Math.ceil((compPrices.length - 1) / 2)] / 2 : null;
  const f = (k, label, type = "text", extra = "") => `<label class="field"><span>${label}</span><input id="p-${p.id}-${k}" type="${type}" data-pid="${p.id}" data-pf="${k}" value="${esc(p[k])}" ${extra}></label>`;
  const bf = (k, label) => `<label class="field"><span>${label}</span><input id="p-${p.id}-b-${k}" type="text" inputmode="decimal" data-pid="${p.id}" data-band="${k}" value="${esc(p.bands[k])}" placeholder="—"></label>`;
  const sel = (k, label, list) => `<label class="field"><span>${label}</span><select id="p-${p.id}-${k}" data-pid="${p.id}" data-pf="${k}">${opt(list, p[k])}</select></label>`;
  const hist = p.history.slice(-6).reverse().map(h => `<li><span class="num small">${esc(h.date)}</span> ${esc(h.field)}: ${esc(h.from || "—")} → <b>${esc(h.to || "—")}</b>${h.source ? ` · <a href="${esc(h.source)}" target="_blank" rel="noopener">source</a>` : ""}</li>`).join("");
  const where = [p.address, p.suburb].filter(Boolean).join(", ");
  return `<article class="prop tier-${p.tier}" id="prop-${p.id}">
  <div class="head">
    <div style="display:grid;gap:6px;min-width:0">
      <div class="row" style="gap:6px"><span class="chip ${p.tier === "priority" ? "accent" : ""}">${esc(TIERS[p.tier])}</span><span class="chip ${statusTone}">${esc(p.status)}</span>${p.lead !== "mainstream" ? `<span class="chip info">${esc(LEAD_TYPES[p.lead])}</span>` : ""}${!p.verified ? `<span class="chip warn">Unverified</span>` : ""}</div>
      <div class="addr">${esc(p.address || "Untitled property")}${p.suburb ? `<span class="muted" style="font-weight:500">, ${esc(p.suburb)}</span>` : ""}</div>
      <div class="facts">${facts || `<span>Add details below</span>`}</div>
    </div>
    <div class="score"><div class="big" style="color:var(--${scoreTone})">${A.score}</div><div class="label">fit</div></div>
  </div>
  <div class="body">
    <div class="chips">${A.flags.map(x => `<span class="chip bad">${esc(x)}</span>`).join("")}${A.pros.map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div>
    <div class="ruler">${rulerHTML(p, A.price)}<p class="verdict" style="color:var(--${v.tone === "info" ? "muted" : v.tone})">${esc(v.text)}</p></div>
    ${p.notes ? `<p class="small">${esc(p.notes)}</p>` : ""}
    <p class="small muted">Due diligence ${ddDone}/${items.length}${median ? ` · Comparable median ${fmt(median)} (${compPrices.length})` : ""}${p.flood ? ` · Flood: ${esc(p.flood)}` : ""}${p.url ? ` · <a href="${esc(p.url)}" target="_blank" rel="noopener">View listing</a>` : ""}</p>
  </div>
  <details${openCards.has(p.id) ? " open" : ""} data-card="${p.id}">
    <summary>Edit details, bands and due diligence</summary>
    <div class="edit">
      <div class="grid3">
        ${f("address", "Address")}${f("suburb", "Suburb")}
        ${sel("tier", "Tier", Object.entries(TIERS))}${sel("status", "Status", STATUSES.map(s => [s, s]))}
        ${sel("lead", "Lead type", Object.entries(LEAD_TYPES))}
        ${f("price", "Price guide", "text", 'placeholder="e.g. $615-630k"')}
        ${inv ? f("rent", "Weekly rent estimate ($)", "number", 'min="0"') : ""}
        ${f("beds", "Beds", "number", 'min="0"')}${f("baths", "Baths", "number", 'min="0"')}${f("cars", "Car spaces", "number", 'min="0"')}
        ${f("land", "Land m²", "number", 'min="0"')}${f("dom", "Days on market", "number", 'min="0"')}
        ${sel("pool", "Pool", [["unknown", "Unknown"], ["yes", "Yes"], ["buildable", "No, but buildable"], ["no", "No, not buildable"]])}
        ${sel("access", "Side/rear access", [["unknown", "Unknown"], ["yes", "Yes"], ["no", "No"]])}
        ${sel("shed", "Shed", [["unknown", "Unknown"], ["powered", "Powered"], ["unpowered", "Unpowered"], ["none", "None"]])}
        ${f("trainKm", "Train station km", "number", 'min="0" step="0.1"')}${f("schoolKm", esc(state.brief.school || "Anchor") + " km", "number", 'min="0" step="0.1"')}
      </div>
      <div class="row">
        <label class="check"><input id="p-${p.id}-solar" type="checkbox" data-pid="${p.id}" data-pb="solar"${p.solar ? " checked" : ""}> Solar</label>
        <label class="check"><input id="p-${p.id}-battery" type="checkbox" data-pid="${p.id}" data-pb="battery"${p.battery ? " checked" : ""}> Battery</label>
        <label class="check"><input id="p-${p.id}-rain" type="checkbox" data-pid="${p.id}" data-pb="rain"${p.rain ? " checked" : ""}> Rainwater</label>
        <label class="check"><input id="p-${p.id}-verified" type="checkbox" data-pid="${p.id}" data-pb="verified"${p.verified ? " checked" : ""}> Confirmed from a public source</label>
      </div>
      <div><span class="label">Negotiation bands</span><p class="small muted">Set from comparable sales. Walk-away is the price at which you stop.</p></div>
      <div class="grid3">${bf("open", "Opening offer")}${bf("target", "Target")}${bf("comfortable", "Comfortable")}${bf("limit", "Limit")}${bf("walk", "Walk-away")}</div>
      <div><span class="label">Comparable sales</span></div>
      <div class="tablewrap"><table><thead><tr><th>Address</th><th>Sold price</th><th>Date</th><th>Land m²</th><th></th></tr></thead><tbody>${comps}</tbody></table></div>
      <div><button class="btn sm" type="button" data-act="addcomp" data-pid="${p.id}">Add comparable</button></div>
      <div><span class="label">Due diligence</span></div>
      <div class="grid2">${dd}</div>
      <label class="field"><span>Flood and insurance notes</span><input id="p-${p.id}-flood" type="text" data-pid="${p.id}" data-pf="flood" value="${esc(p.flood)}"></label>
      <label class="field"><span>Source links (one per line)</span><textarea id="p-${p.id}-sources" data-pid="${p.id}" data-pf="sources">${esc(p.sources.join("\n"))}</textarea></label>
      <label class="field"><span>Notes</span><textarea id="p-${p.id}-notes" data-pid="${p.id}" data-pf="notes">${esc(p.notes)}</textarea></label>
      <div class="row small">${where ? `<a href="${g('"' + where + '"')}" target="_blank" rel="noopener">Search this address</a><a href="${g('"' + where + '" sold')}" target="_blank" rel="noopener">Sale history</a>` : ""}${p.sources.map((s, i) => `<a href="${esc(s)}" target="_blank" rel="noopener">Source ${i + 1}</a>`).join("")}</div>
      ${hist ? `<div><span class="label">Recent changes</span><ul class="rules small">${hist}</ul></div>` : ""}
      <div class="row between">
        <span class="small muted">Added ${esc(p.added)}</span>
        ${confirmDel === p.id
          ? `<div class="confirm"><span>Delete this property and its history?</span><button class="btn sm danger" type="button" data-act="del" data-pid="${p.id}">Delete</button><button class="btn sm" type="button" data-act="nodel">Cancel</button></div>`
          : `<button class="btn sm ghost danger" type="button" data-act="askdel" data-pid="${p.id}">Delete property</button>`}
      </div>
    </div>
  </details>
</article>`;
}

const openCards = new Set();
let confirmDel = null, propFilter = "all";
function renderProps() {
  const order = ["priority", "candidate", "watch", "downgraded", "outside"];
  const list = state.props.filter(p => propFilter === "all" || p.tier === propFilter)
    .sort((a, b) => order.indexOf(a.tier) - order.indexOf(b.tier) || assess(b).score - assess(a).score);
  const counts = Object.fromEntries(order.map(t => [t, state.props.filter(p => p.tier === t).length]));
  const filters = [["all", "All", state.props.length]].concat(order.map(t => [t, TIERS[t], counts[t]])).filter(x => x[0] === "all" || x[2])
    .map(([k, l, n]) => `<button class="btn sm${propFilter === k ? " primary" : ""}" type="button" data-act="filter" data-k="${k}">${esc(l)} <span class="num">${n}</span></button>`).join("");
  return `<section class="panel">
  <div class="row between"><div><h2>My properties</h2><p class="small muted">Properties you're tracking, sorted by tier then fit. Press <b>Track</b> on a search result, or add one by hand.</p></div>
    <button class="btn primary" type="button" data-act="addprop">Add property</button></div>
  <div class="row">${filters}</div>
  <div class="props">${list.map(propCard).join("") || `<div class="card empty"><h3>Nothing tracked yet</h3><p>Run a search and press Track on the listings you like, or add a property by hand.</p></div>`}</div>
</section>`;
}

/* ---------- watch run ---------- */
let draftRun = null;
function startRun() { draftRun = { date: today(), notes: "", rows: {} }; }
function renderRun() {
  const last = state.runs[state.runs.length - 1];
  if (!draftRun) startRun();
  state.props.forEach(p => { if (!draftRun.rows[p.id] && p.tier !== "outside") draftRun.rows[p.id] = { price: p.price, status: p.status, dom: p.dom, source: p.url || "", checked: false }; });
  const rows = state.props.filter(p => draftRun.rows[p.id]).map(p => {
    const r = draftRun.rows[p.id];
    return `<tr>
      <td><label class="check"><input id="r-${p.id}-chk" type="checkbox" data-rid="${p.id}" data-rf="checked"${r.checked ? " checked" : ""}> <span><b>${esc(p.address || "Untitled")}</b><br><span class="small muted">${esc(p.suburb)} · ${esc(TIERS[p.tier])}</span></span></label></td>
      <td><input id="r-${p.id}-price" type="text" data-rid="${p.id}" data-rf="price" value="${esc(r.price)}" aria-label="Price guide"><span class="small muted">was ${esc(p.price || "—")}</span></td>
      <td><select id="r-${p.id}-status" data-rid="${p.id}" data-rf="status" aria-label="Status">${opt(STATUSES.map(s => [s, s]), r.status)}</select></td>
      <td><input id="r-${p.id}-dom" type="number" data-rid="${p.id}" data-rf="dom" value="${esc(r.dom)}" aria-label="Days on market" style="max-width:90px"></td>
      <td><input id="r-${p.id}-src" type="url" data-rid="${p.id}" data-rf="source" value="${esc(r.source)}" placeholder="https://" aria-label="Source link"></td>
    </tr>`;
  }).join("");
  const pastRuns = state.runs.slice().reverse().map(r => `<tr><td class="num">${esc(r.date)}</td><td class="num">${r.checked}</td><td class="num">${r.changes.length}</td><td>${esc(r.notes)}</td></tr>`).join("");
  return `<section class="panel">
  <div class="card">
    <div class="row between"><div><h2>Watch run</h2><p class="small muted">${last ? `Last run ${esc(last.date)}.` : "No runs yet."} Run a search first: tracked listings still on the market update their price automatically. Then confirm each status, tick it off, and save.</p></div>
      <label class="field" style="max-width:170px"><span>Run date</span><input id="run-date" type="date" data-run="date" value="${esc(draftRun.date)}"></label></div>
    <div class="tablewrap"><table><thead><tr><th>Property</th><th>Price guide</th><th>Status</th><th>Days</th><th>Source</th></tr></thead><tbody>${rows || `<tr><td colspan="5" class="muted">Track some properties first.</td></tr>`}</tbody></table></div>
    <label class="field"><span>Run notes</span><textarea id="run-notes" data-run="notes">${esc(draftRun.notes)}</textarea></label>
    <div class="row"><button class="btn primary" type="button" data-act="saverun">Save run</button><button class="btn" type="button" data-act="resetrun">Reset</button>${searchBtn("Run search first", "ghost")}</div>
  </div>
  ${pastRuns ? `<div class="card"><h3>Past runs</h3><div class="tablewrap"><table><thead><tr><th>Date</th><th class="num">Checked</th><th class="num">Changes</th><th>Notes</th></tr></thead><tbody>${pastRuns}</tbody></table></div></div>` : ""}
</section>`;
}
function saveRun() {
  const date = draftRun.date || today(), changes = [];
  let checked = 0;
  state.props.forEach(p => {
    const r = draftRun.rows[p.id]; if (!r) return;
    if (r.checked) checked++;
    [["price", "Price"], ["status", "Status"], ["dom", "Days on market"]].forEach(([k, label]) => {
      if (String(r[k] ?? "") !== String(p[k] ?? "")) {
        const h = { date, field: label, from: String(p[k] ?? ""), to: String(r[k] ?? ""), source: r.source };
        p.history.push(h); changes.push(Object.assign({ pid: p.id }, h)); p[k] = r[k];
      }
    });
    if (r.source && !p.sources.includes(r.source)) p.sources.push(r.source);
  });
  state.runs.push({ id: uid(), date, notes: draftRun.notes, checked, changes });
  draftRun = null; save(); toast(`Run saved: ${changes.length} change${changes.length === 1 ? "" : "s"}`);
  setTab("report");
}

/* ---------- report ---------- */
function buildReport() {
  const b = state.brief, runs = state.runs, last = runs[runs.length - 1], prev = runs[runs.length - 2], R = state.results;
  const L = [];
  const name = (p) => [p.address || "Untitled", p.suburb].filter(Boolean).join(", ");
  L.push(`PROPERTY WATCH — ${today()}`);
  if (b.name) L.push(b.name);
  L.push(`Brief: ${b.purpose === "investment" ? "investment, " : ""}${b.beds}+ bed, ${b.baths}+ bath${b.landMin ? ", " + b.landMin + "+ m²" : ""}, ceiling ${fmt(parseMoney(b.ceiling))}${b.preferredMax ? ", prefer ≤ " + fmt(parseMoney(b.preferredMax)) : ""}${b.purpose === "investment" && b.targetYield ? ", target yield " + b.targetYield + "%" : ""}. Suburbs: ${b.suburbs.map(s => parseSuburb(s).name).join(", ") || "not set"}.`);
  L.push("");
  if (R) {
    L.push(`LATEST SEARCH (${new Date(R.at).toLocaleDateString("en-AU")})`);
    const scored = R.items.map(it => ({ it, A: assess(resultAsProp(it)) }));
    L.push(`- ${R.items.length} listings, ${scored.filter(x => !x.A.flags.length).length} meet every must-have.`);
    if (!R.first) {
      const nw = scored.filter(x => x.it.isNew), ch = scored.filter(x => x.it.wasPrice);
      L.push(`- New since last search: ${nw.length}. Price changes: ${ch.length}. No longer listed: ${(R.gone || []).length}.`);
      ch.forEach(x => L.push(`  • ${x.it.address}, ${x.it.suburb}: ${x.it.wasPrice} → ${x.it.priceText} (${x.it.url})`));
      (R.gone || []).slice(0, 10).forEach(x => L.push(`  • Gone: ${x.address}, ${x.suburb} (${x.priceText})`));
    }
    const top = scored.filter(x => !x.A.flags.length).sort((a, b2) => b2.A.score - a.A.score).slice(0, 8);
    if (top.length) { L.push("- Best matches:"); top.forEach(x => L.push(`  • ${x.it.address}, ${x.it.suburb} · ${x.it.priceText} · fit ${x.A.score}${x.it.isNew ? " · NEW" : ""}${x.it.signals.length ? " · " + x.it.signals.join(", ") : ""} · ${x.it.url}`)); }
    L.push("");
  }
  L.push(`WATCH RUN CHANGES${prev ? " SINCE " + prev.date : ""}`);
  if (!last) L.push("- No watch run saved yet.");
  else if (!last.changes.length) L.push("- No price or status changes recorded.");
  else last.changes.forEach(c => { const p = state.props.find(x => x.id === c.pid); L.push(`- ${p ? name(p) : "Removed property"}: ${c.field} ${c.from || "—"} → ${c.to || "—"}${c.source ? " (" + c.source + ")" : ""}`); });
  L.push("");
  L.push("PRIORITY PROPERTIES AGAINST BANDS");
  const pri = state.props.filter(p => p.tier === "priority");
  if (!pri.length) L.push("- None marked priority.");
  pri.forEach(p => {
    const A = assess(p), v = bandVerdict(p, A.price), B = p.bands;
    const bands = ["open", "target", "comfortable", "limit", "walk"].filter(k => B[k]).map(k => `${k} ${fmt(parseMoney(B[k]))}`).join(", ");
    L.push(`- ${name(p)} [${p.status}] fit ${A.score}${A.yld !== null ? " · yield " + A.yld.toFixed(1) + "%" : ""}${A.flags.length ? " · flags: " + A.flags.join(", ") : ""}`);
    if (bands) L.push(`  Bands: ${bands}`);
    L.push(`  ${v.text}`);
    const ddOpen = ddItems().filter(([k]) => !p.dd[k]).map(([, l]) => l.split(" (")[0]);
    if (ddOpen.length) L.push(`  DD outstanding: ${ddOpen.slice(0, 4).join("; ")}${ddOpen.length > 4 ? "; +" + (ddOpen.length - 4) + " more" : ""}`);
    if (p.url || p.sources[0]) L.push(`  Source: ${p.url || p.sources[p.sources.length - 1]}`);
  });
  L.push("");
  L.push("CANDIDATES");
  const cands = state.props.filter(p => p.tier === "candidate" && !["Sold", "Withdrawn"].includes(p.status)).sort((a, b2) => assess(b2).score - assess(a).score);
  if (!cands.length) L.push("- None tracked.");
  cands.forEach(p => { const A = assess(p); L.push(`- ${name(p)} · ${p.price || "no guide"} · fit ${A.score}${p.lead !== "mainstream" ? " · " + LEAD_TYPES[p.lead] : ""}${p.verified ? "" : " · UNVERIFIED"}${A.flags.length ? " · flags: " + A.flags.join(", ") : ""}${p.url ? " · " + p.url : ""}`); });
  L.push("");
  L.push("WATCHLIST");
  const w = state.props.filter(p => p.tier === "watch");
  if (!w.length) L.push("- Empty.");
  w.forEach(p => L.push(`- ${name(p)} [${p.status}]${p.price ? " " + p.price : ""}${p.notes ? " — " + p.notes : ""}`));
  if (last && last.notes) { L.push(""); L.push("RUN NOTES"); L.push(last.notes); }
  L.push("");
  L.push("Public listing data only. Signals read from listing text are unconfirmed. No agents contacted, no offers made.");
  return L.join("\n");
}
function renderReport() {
  return `<section class="panel"><div class="card">
    <div class="row between"><div><h2>Report</h2><p class="small muted">Plain-text summary of the latest search and watch run, ready to paste into an email or message.</p></div>
      <div class="row"><button class="btn primary" type="button" data-act="copyreport">Copy</button><button class="btn" type="button" data-act="dlreport">Save as file</button></div></div>
    <pre class="report" id="reportText">${esc(buildReport())}</pre>
  </div></section>`;
}

/* ---------- export / import ---------- */
function saveFile(filename, text, mime) {
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = Object.assign(document.createElement("a"), { href: url, download: filename });
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch { const el = $("#reportText"); if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Press Ctrl/Cmd+C to copy the selected text"); }
}
$("#exportBtn").addEventListener("click", () => {
  /* the API key stays in this browser; backups are meant to be shared */
  const out = Object.assign({}, state, { example: false, settings: { searchUrl: state.settings.searchUrl, apiKey: "" } });
  saveFile(`property-watch-${today()}.json`, JSON.stringify(out, null, 2), "application/json");
});
$("#importFile").addEventListener("change", (e) => {
  const file = e.target.files[0]; if (!file) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const data = JSON.parse(fr.result);
      if (!data || !data.brief || !Array.isArray(data.props)) throw new Error("shape");
      const keepKey = state.settings.apiKey;
      state = normalise(Object.assign(data, { example: false, tab: data.tab || "props" }));
      if (!state.settings.apiKey) state.settings.apiKey = keepKey;
      draftRun = null; save(); render(); toast(`Imported ${state.props.length} properties`);
    } catch { toast("That file isn't a Property Watch backup."); }
    e.target.value = "";
  };
  fr.readAsText(file);
});

/* ---------- suburb type-ahead ---------- */
let acItems = [], acIndex = -1;
function addSuburbs(list) {
  list.forEach(s => { s = s.trim(); if (s && !state.brief.suburbs.some(x => x.toLowerCase() === s.toLowerCase())) state.brief.suburbs.push(s); });
  save(); render(); const i = $("#subInput"); if (i) i.focus();
}
function drawAc() {
  const ul = $("#subList"), inp = $("#subInput"); if (!ul) return;
  ul.hidden = !acItems.length; inp.setAttribute("aria-expanded", String(acItems.length > 0));
  ul.innerHTML = acItems.map((s, i) => `<li role="option" id="ac-${i}" data-ac="${i}" aria-selected="${i === acIndex}"><span>${esc(s.n)} <span class="muted">${esc(s.s)}</span></span><span class="pc">${esc(s.p)}</span></li>`).join("");
  if (acIndex >= 0) inp.setAttribute("aria-activedescendant", "ac-" + acIndex); else inp.removeAttribute("aria-activedescendant");
}
app.addEventListener("keydown", (e) => {
  if (e.target.id !== "subInput" || !acItems.length) return;
  if (e.key === "ArrowDown") { e.preventDefault(); acIndex = (acIndex + 1) % acItems.length; drawAc(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); acIndex = (acIndex - 1 + acItems.length) % acItems.length; drawAc(); }
  else if (e.key === "Escape") { acItems = []; drawAc(); }
});
app.addEventListener("mousedown", (e) => {
  const li = e.target.closest("[data-ac]"); if (!li) return;
  e.preventDefault(); const s = acItems[+li.dataset.ac]; acItems = []; addSuburbs([subLabel(s)]);
});

/* ---------- events ---------- */
function findProp(id) { return state.props.find(p => p.id === id); }
function logChange(p, field, from, to) { if (String(from ?? "") !== String(to ?? "") && ["price", "status"].includes(field)) p.history.push({ date: today(), field: field === "price" ? "Price" : "Status", from: String(from ?? ""), to: String(to ?? ""), source: "" }); }

app.addEventListener("click", (e) => {
  const go = e.target.closest("[data-tab-go]"); if (go) return setTab(go.dataset.tabGo);
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, pid = el.dataset.pid;
  if (act === "search") { if (!searching) runSearch(); return; }
  if (act === "fresh") { state = normalise({ v: 2, example: false, brief: blankBrief(), props: [], runs: [], results: null, settings: state.settings, tab: "brief" }); draftRun = null; }
  else if (act === "keep") { state.example = false; }
  else if (act === "rmsub") { state.brief.suburbs.splice(+el.dataset.i, 1); }
  else if (act === "clearsubs") { state.brief.suburbs = []; }
  else if (act === "filter") { propFilter = el.dataset.k; }
  else if (act === "track") { trackResult(el.dataset.id); }
  else if (act === "addprop") { const p = blankProp(); state.props.unshift(p); openCards.add(p.id); propFilter = "all"; save(); render(); const inp = $(`#p-${p.id}-address`); if (inp) inp.focus(); return; }
  else if (act === "askdel") { confirmDel = pid; }
  else if (act === "nodel") { confirmDel = null; }
  else if (act === "del") { state.props = state.props.filter(p => p.id !== pid); confirmDel = null; toast("Property deleted"); }
  else if (act === "addcomp") { findProp(pid).comps.push({ addr: "", price: "", date: "", land: "" }); openCards.add(pid); }
  else if (act === "rmcomp") { findProp(pid).comps.splice(+el.dataset.i, 1); }
  else if (act === "saverun") { return saveRun(); }
  else if (act === "resetrun") { startRun(); }
  else if (act === "copyreport") { return copyText(buildReport()); }
  else if (act === "dlreport") { return saveFile(`property-watch-report-${today()}.txt`, buildReport(), "text/plain"); }
  const y = window.scrollY; save(); render(); window.scrollTo(0, y);
});
app.addEventListener("toggle", (e) => { const d = e.target; if (d.dataset && d.dataset.card) d.open ? openCards.add(d.dataset.card) : openCards.delete(d.dataset.card); }, true);
app.addEventListener("submit", (e) => {
  if (e.target.id !== "subForm") return;
  e.preventDefault();
  if (acItems.length && acIndex >= 0) { const s = acItems[acIndex]; acItems = []; return addSuburbs([subLabel(s)]); }
  const v = $("#subInput").value.trim(); if (!v) return;
  /* a typed name that matches exactly one suburb gets its state and postcode filled in */
  const exact = suggest(v).filter(s => s.k === v.toLowerCase() || subLabel(s).toLowerCase() === v.toLowerCase());
  acItems = [];
  if (exact.length === 1) return addSuburbs([subLabel(exact[0])]);
  if (exact.length > 1) { acItems = exact; acIndex = 0; $("#subInput").focus(); drawAc(); toast("More than one match: pick the right state"); return; }
  addSuburbs(v.split(/;|\n/));
});

function applyInput(t) {
  const d = t.dataset;
  const val = t.type === "checkbox" ? t.checked : t.value;
  if (d.b !== undefined) { state.brief[d.b] = val; }
  else if (d.type) { const set = new Set(state.brief.types); val ? set.add(d.type) : set.delete(d.type); state.brief.types = PROPERTY_TYPES.map(x => x[0]).filter(x => set.has(x)); }
  else if (d.set) { state.settings[d.set] = val.trim(); searchError = null; }
  else if (d.pid && d.pf) { const p = findProp(d.pid); if (d.pf === "sources") p.sources = val.split("\n").map(s => s.trim()).filter(Boolean); else p[d.pf] = val; }
  else if (d.pid && d.pb) { findProp(d.pid)[d.pb] = val; }
  else if (d.pid && d.band) { findProp(d.pid).bands[d.band] = val; }
  else if (d.pid && d.dd) { findProp(d.pid).dd[d.dd] = val; }
  else if (d.pid && d.comp !== undefined) { findProp(d.pid).comps[+d.comp][d.cf] = val; }
  else if (d.rid) { draftRun.rows[d.rid][d.rf] = val; }
  else if (d.run) { draftRun[d.run] = val; }
  else if (d.ui) { if (d.ui === "sort") resSort = val; else if (d.ui === "hide") resHide = val; else resQuery = val; }
  else return false;
  return true;
}
const focusVals = new Map();
app.addEventListener("focusin", (e) => { const t = e.target; if (t.dataset && t.dataset.pid && t.dataset.pf) focusVals.set(t, findProp(t.dataset.pid)?.[t.dataset.pf]); });
app.addEventListener("focusout", (e) => { if (e.target.id === "subInput") setTimeout(() => { if (document.activeElement?.id !== "subInput") { acItems = []; drawAc(); } }, 120); });
let filterTimer;
app.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "subInput") { acItems = suggest(t.value); acIndex = acItems.length ? 0 : -1; return drawAc(); }
  if (t.dataset.ui === "q") {
    resQuery = t.value; clearTimeout(filterTimer);
    filterTimer = setTimeout(() => { const pos = t.selectionStart; render(); const n = $("#r-q"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250);
    return;
  }
  if (t.type !== "checkbox" && t.tagName !== "SELECT" && applyInput(t)) save();
});
app.addEventListener("change", (e) => {
  const t = e.target;
  if (t.id === "subInput" || t.dataset.ui === "q") return;
  if (t.dataset.pid && t.dataset.pf && ["price", "status"].includes(t.dataset.pf)) {
    const p = findProp(t.dataset.pid), before = focusVals.has(t) ? focusVals.get(t) : p[t.dataset.pf];
    applyInput(t); logChange(p, t.dataset.pf, before, p[t.dataset.pf]); focusVals.delete(t);
  } else if (!applyInput(t)) return;
  save();
  if (t.dataset.rid || t.dataset.run || t.dataset.set || t.tagName === "TEXTAREA") return;
  const y = window.scrollY; render(); window.scrollTo(0, y);
});

render();
})();
</script>
